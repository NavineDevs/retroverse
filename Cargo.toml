[package]
name = "retroverse"
version = "0.1.0"
edition = "2024"
description = "A base project for a launcher. RetroVerse by Navine."
license = "MIT"
readme = "README.md"
keywords = ["launcher", "game", "version-manager", "retro"]
categories = ["games"]

[lib]
name = "retroverse"
path = "src/lib.rs"

[[bin]]
name = "retroverse"
path = "src/main.rs"

[dependencies]
dirs = "7.0.0"
eframe = "0.36.2"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
